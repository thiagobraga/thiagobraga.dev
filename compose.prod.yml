name: thiagobraga

# Production stack. Lives at /home/deploy/app/ on the OCI box.
# Pulls the prebuilt image from GHCR — no source or build tools on the server.
# Traefik (external `proxy` network) terminates TLS via Let's Encrypt.

services:
  app:
    image: ghcr.io/${GHCR_OWNER}/thiagobraga.dev:latest
    container_name: thiagobraga-app
    restart: unless-stopped
    pull_policy: always
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.http.routers.thiago.rule: "Host(`thiagobraga.dev`) || Host(`www.thiagobraga.dev`)"
      traefik.http.routers.thiago.entrypoints: "websecure"
      traefik.http.routers.thiago.tls: "true"
      traefik.http.routers.thiago.tls.certresolver: "letsencrypt"
      traefik.http.services.thiago.loadbalancer.server.port: "8080"

networks:
  proxy:
    external: true
